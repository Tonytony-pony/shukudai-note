<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>宿題ゲームノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: phone-first single column. sticky date bar, status banner, homework list, play card, bottom tabs */
  --bg:#EEF4FA; --surface:#FFFFFF; --ink:#16273A; --muted:#5C6F85; --line:#D6E0EB;
  --accent:#2563EB; --on-accent:#FFFFFF; --accent-soft:#E3ECFD;
  --ok:#168A5C; --ok-bg:#D9F3E6; --warn:#8F5A00; --warn-bg:#FFEBB8; --bad:#C23B3B; --bad-bg:#FFE1E1;
  --school:#2F6FED; --math:#C96A0B; --kumon:#7B4BE0;
  --shadow:0 1px 2px rgba(22,39,58,.06),0 10px 28px rgba(22,39,58,.08);
  --scrim:rgba(14,24,36,.55);
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  --num:'Fredoka','Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1822; --surface:#17232F; --ink:#E9F0F8; --muted:#97A8BC; --line:#27394B;
  --accent:#6F9CFF; --on-accent:#0B1626; --accent-soft:#1D3354;
  --ok:#4FD6A3; --ok-bg:#123A2D; --warn:#F5C86B; --warn-bg:#3A2D10; --bad:#FF8A8A; --bad-bg:#47191C;
  --school:#7DA6FF; --math:#F2A257; --kumon:#B198FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1822; --surface:#17232F; --ink:#E9F0F8; --muted:#97A8BC; --line:#27394B;
  --accent:#6F9CFF; --on-accent:#0B1626; --accent-soft:#1D3354;
  --ok:#4FD6A3; --ok-bg:#123A2D; --warn:#F5C86B; --warn-bg:#3A2D10; --bad:#FF8A8A; --bad-bg:#47191C;
  --school:#7DA6FF; --math:#F2A257; --kumon:#B198FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
h2{font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px;text-wrap:balance}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top{padding:10px 0 8px;display:flex;align-items:center;gap:8px}
.datenav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.sq{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;flex:none}
.date{flex:1;min-width:0;text-align:center;line-height:1.2}
.date b{font-size:20px;font-weight:900;display:block}
.date span{font-size:13px;color:var(--muted);font-weight:700}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;flex:none}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* status banner */
.status{border-radius:20px;padding:18px 18px;display:flex;align-items:center;gap:16px;background:var(--surface);box-shadow:var(--shadow);margin-top:8px}
.status .big{font-family:var(--num);font-weight:600;font-size:52px;line-height:1;white-space:nowrap}
.status .big small{font-size:24px;color:var(--muted)}
.status .msg{min-width:0}
.status .msg b{display:block;font-size:20px;font-weight:900;line-height:1.3;text-wrap:balance}
.status .msg span{font-size:14px;color:var(--muted);font-weight:500}
.status.ok{background:var(--ok-bg)}.status.ok .big,.status.ok .big small{color:var(--ok)}
.status.warn .big{color:var(--accent)}
.status.past{opacity:.92}

/* list */
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--accent-soft)}
.mark{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.row.done .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.row .t{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.row.done .t{color:var(--muted)}
.row .meta{display:flex;align-items:center;gap:8px;flex:none;color:var(--muted);font-size:13px;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.04em;padding:1px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));margin-bottom:2px}
.cam{display:inline-flex;align-items:center;gap:4px}
.empty{padding:24px 18px;color:var(--muted);text-align:center;font-weight:500}

/* play */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.meter{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter .lab{font-weight:700;font-size:14px;color:var(--muted)}
.meter .v{font-family:var(--num);font-size:40px;font-weight:600;line-height:1}
.meter .v.neg{color:var(--bad)}
.bar{height:10px;border-radius:999px;background:var(--line);margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over i{background:var(--bad)}
.adj{display:flex;gap:8px;align-items:center;margin-left:auto}
.mini{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin:14px 0}
.seg button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:900;font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.step{display:flex;align-items:center;justify-content:center;gap:14px}
.step .sq{width:56px;height:56px;font-size:26px;font-weight:700}
.step .val{font-family:var(--num);font-size:46px;font-weight:600;min-width:112px;text-align:center;line-height:1}
.step .val small{font-size:18px;color:var(--muted);margin-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 16px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;border:0;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:18px}
.btn.sub{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-size:16px;min-height:50px}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:active{filter:brightness(.94)}
.btn[disabled]{opacity:.5}
.log{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.log .li{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;font-size:15px;border-bottom:1px dashed var(--line)}
.log .li:last-child{border-bottom:0}
.log .li .tm{color:var(--muted);font-family:var(--num);font-size:14px;width:46px}
.log .li .sp{flex:1}
.badge{font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;font-weight:700;min-height:36px}
.crests{display:flex;justify-content:center;gap:14px;margin:0;padding:2px 0 10px}
.crest{width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.crest img{display:block;width:100%;height:100%}
.crest.contain img{object-fit:contain;padding:8px}
.crest.cover img{object-fit:cover}
@media(max-width:380px){.crests{gap:10px}.crest{width:56px;height:56px}}
.sect{margin-bottom:14px}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ch b{font-size:19px;font-weight:900}
.ch span{font-size:12px;font-weight:700;color:var(--muted)}
.ch .badge{margin-left:auto}
.badge.okb{background:var(--ok-bg);color:var(--ok)}
.kv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kv>span:first-child{font-weight:700;font-size:14px;color:var(--muted)}
.kv b{font-family:var(--num);font-size:30px;font-weight:600}
.kv b small{font-size:16px;color:var(--muted);margin-left:2px}
.apr{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--ok);min-height:44px}
.apr .link{margin-left:auto}
.trow{display:flex;align-items:center;gap:6px;margin:10px 0}
.trow .tl{width:42px;flex:none;font-weight:900;font-size:14px;color:var(--muted)}
.trow select{flex:1;min-width:0;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--num);font-size:26px;font-weight:600;text-align:center;text-align-last:center}
.trow .colon{font-family:var(--num);font-size:26px;font-weight:600}
.trow .mini{min-height:52px;min-width:44px;padding:0 6px;flex:none}
.dur{text-align:center;font-weight:900;font-size:15px;margin:4px 0 14px}
.dur b{font-size:34px;font-weight:600}
.dur.bad{color:var(--bad)}
.totals{display:flex;gap:10px;margin-top:6px}
.totals div{flex:1;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.totals b{display:block;font-family:var(--num);font-size:24px;color:var(--ink);font-weight:600}

/* history */
.hrow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.hrow:last-child{border-bottom:0}
.hd{width:52px;flex:none;line-height:1.2}
.hd b{font-family:var(--num);font-size:18px;display:block}
.hd span{font-size:12px;color:var(--muted);font-weight:700}
.hd.sun span{color:var(--bad)}
.dots{display:flex;gap:5px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
.hsum{flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:700;text-align:right}
.hsum b{color:var(--ink)}

/* parent */
.sec{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.sec h3{margin:0 0 4px;font-size:17px;font-weight:900}
.sec p{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:500}
.field{display:flex;gap:8px;margin-top:10px}
.field select,.field input[type=text],.field input[type=password]{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-weight:700;min-width:0}
.field input[type=text],.field input[type=password]{flex:1}
.field .btn{width:auto;min-height:46px;padding:0 18px;font-size:15px;border-radius:12px}
.item{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line);font-weight:700}
.item:last-of-type{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.x{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:20px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.wd button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:900}
.wd button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wd button .c{display:block;font-size:10px;font-weight:700;opacity:.75;line-height:1}
.ob{font-size:13px;font-weight:500;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.stepline{display:flex;align-items:center;gap:12px}
.stepline .val{font-family:var(--num);font-size:30px;font-weight:600;min-width:84px;text-align:center}
.note{font-size:13px;color:var(--muted);font-weight:500}

.picks{margin:4px 0 0}
.pick{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-weight:700;font-size:17px}
.pick:last-child{border-bottom:0}
.pick .box{width:32px;height:32px;border-radius:9px;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.pick.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick .t{flex:1;min-width:0;overflow-wrap:anywhere}
.pick .okm{font-size:12px;font-weight:900;color:var(--ok);background:var(--ok-bg);padding:1px 9px;border-radius:999px}
.mxwrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.mxr{display:grid;grid-template-columns:minmax(84px,1fr) repeat(7,38px);gap:5px;align-items:center;margin-bottom:5px;min-width:max-content}
.mxl{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere;padding-right:4px;width:92px}
.mxh{text-align:center;font-weight:900;font-size:14px;color:var(--muted)}
.mxh.cur{color:var(--accent)}
.mx{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0}
.mx svg{width:18px;height:18px}
.mx.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mx.cur:not(.on){border-color:var(--accent)}
.lrow{display:flex;align-items:center;gap:4px;min-height:54px;border-bottom:1px solid var(--line);padding:0 2px}
.lrow:last-of-type{border-bottom:0}
.lrow.cur{background:var(--accent-soft);border-radius:12px}
.ll{width:58px;flex:none;font-weight:900;font-size:16px;line-height:1.2;padding-left:6px}
.ll em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.lv{flex:1;text-align:center;font-size:26px;font-weight:600;min-width:56px;line-height:1}
.lv small{font-size:13px;color:var(--muted);margin-left:1px}
.mini.t{min-width:38px;padding:0 3px;font-size:13px;flex:none;min-height:40px}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:transparent;border-radius:14px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-weight:900;font-size:12px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
svg{display:block}

/* sheet & modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim.mid{align-items:center;padding:16px}
.sheet{width:100%;max-width:640px;max-height:90%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:4px 0 2px;font-size:22px;font-weight:900;line-height:1.35;overflow-wrap:anywhere}
.stline{font-weight:700;font-size:14px;color:var(--muted);margin-bottom:14px}
.stline.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid button{aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--bg)}
.grid img{width:100%;height:100%;object-fit:cover}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stack{display:grid;gap:10px;margin-top:14px}
.modal{width:100%;max-width:360px;background:var(--surface);border-radius:24px;padding:22px 20px;box-shadow:var(--shadow);text-align:center}
.modal h3{margin:0 0 4px;font-size:19px;font-weight:900}
.modal p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.pdots{display:flex;gap:14px;justify-content:center;margin:14px 0 18px}
.pdots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line)}
.pdots i.on{background:var(--ink);border-color:var(--ink)}
.pdots.bad i{border-color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:60px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-family:var(--num);font-size:26px;font-weight:600}
.pad button.f{font-family:var(--font);font-size:14px;font-weight:700;color:var(--muted)}
.viewer{width:100%;max-width:720px;text-align:center}
.viewer img{max-width:100%;max-height:72vh;border-radius:12px;background:#000}
.viewer .btn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;max-width:88vw;text-align:center;box-shadow:var(--shadow)}
.banner{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:13px}
textarea.cp{width:100%;min-height:140px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:14px}
@media (max-width:380px){.status .big{font-size:42px}.step .val{font-size:38px;min-width:92px}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <div id="top"></div>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="メニュー"></nav>
<div id="over"></div>
<div id="toast"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>
<input type="file" id="fileRestore" accept="text/plain,.txt,application/json,.json" hidden>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* ---------- derived ---------- */
var isParent=function(){return Date.now()<S.unlockedUntil};
var catalog=function(){return Array.isArray(S.settings.catalog)?S.settings.catalog:DEFAULT_CATALOG};
function planIds(wd){var d=(S.plan.days||{})[wd];return Array.isArray(d)?d.filter(function(x){return typeof x==='string'}):catalog().map(function(k){return k.id})}
function planFor(date){
  var ids=planIds(parse(date).getDay());
  return catalog().filter(function(k){return ids.indexOf(k.id)>=0}).map(function(k){return {id:k.id,t:k.t,ok:false}});
}
function itemsFor(date){var d=S.days[date];return d&&d.items?d.items:planFor(date)}
var limitDefault=function(){return typeof S.settings.limitDefault==='number'?S.settings.limitDefault:60};
function limitForWd(wd){var m=S.settings.limitWd;return (m&&typeof m[wd]==='number')?m[wd]:limitDefault()}
function limitFor(date){var o=S.limits[date];if(o&&typeof o.min==='number')return o.min;return limitForWd(parse(date).getDay())}
function calc(date){
  var cids=catalog().map(function(k){return k.id});
  var rank=function(i){var x=cids.indexOf(i.id);return x<0?99:x};
  var items=itemsFor(date).slice().sort(function(a,b){return rank(a)-rank(b)});
  var ok=items.filter(function(i){return i.ok}).length;
  var plays=S.plays.filter(function(p){return p.date===date}).sort(function(a,b){return a.at-b.at});
  var d=S.days[date];
  var allowance=(d&&typeof d.preMin==='number')?d.preMin:(typeof S.settings.preMin==='number'?S.settings.preMin:30);
  var preUsed=sum(plays.filter(function(p){return p.pre}));
  var o={items:items,total:items.length,ok:ok,all:ok===items.length,plays:plays,allowance:allowance,preUsed:preUsed,
    remain:allowance-preUsed,appr:(d&&d.preAppr)||null,hasDoc:!!d};
  o.limit=limitFor(date);o.playTotal=sum(plays);o.dayLeft=o.limit-o.playTotal;
  return o;
}
var pad=function(n){return (n<10?'0':'')+n};
var tstr=function(m){return pad(Math.floor(m/60))+':'+pad(m%60)};
var tmin=function(t){var a=/^(\d+):(\d+)$/.exec(t||'');return a?Number(a[1])*60+Number(a[2]):null};
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function ensureTimes(){if(S.pEnd==null||S.pStart==null){S.pEnd=nowMin();S.pStart=Math.max(0,S.pEnd-30)}}

function lastOkAt(c){return c.items.reduce(function(t,i){return Math.max(t,i.okAt||0)},0)}
function isPre(c,startMs){if(c.total===0)return false;if(!c.all)return true;return lastOkAt(c)>startMs}
function timeRow(label,key,m){
  var h=Math.floor(m/60),mi=m%60,ho='',mo='',i,j;
  for(i=0;i<24;i++)ho+='<option value="'+i+'"'+(i===h?' selected':'')+'>'+pad(i)+'</option>';
  for(j=0;j<60;j++)mo+='<option value="'+j+'"'+(j===mi?' selected':'')+'>'+pad(j)+'</option>';
  return '<div class="trow"><span class="tl">'+label+'</span>'+
    '<select data-chg="tH" data-v="'+key+'" aria-label="'+label+'の時">'+ho+'</select><span class="colon">:</span>'+
    '<select data-chg="tM" data-v="'+key+'" aria-label="'+label+'の分">'+mo+'</select>'+
    (key==='pEnd'?'<button class="mini" data-act="tNow">いま</button>':'')+'</div>';
}
function hashPin(p){var h=5381,s='hw|'+p;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return String(h)}

/* ---------- write queue ---------- */
var chain=Promise.resolve();
function enqueue(fn){chain=chain.then(fn).catch(function(e){console.error(e);toast('ほぞんできませんでした。もういちど試してね')});return chain}
function saveSettings(patch){
  return enqueue(function(){var next=Object.assign({},S.settings,patch);return S.db.doc('config/settings').set(next).then(function(){S.settings=next;renderAll()})});
}
function savePlan(days){
  return enqueue(function(){return S.db.doc('config/plan').set({days:days}).then(function(){S.plan={days:days};renderAll()})});
}
function saveDay(date,mut){
  return enqueue(function(){
    var cur=S.days[date];
    var base=cur?clone(cur):{date:date,items:itemsFor(date).map(function(i){return Object.assign({},i)})};
    mut(base);base.date=date;
    return S.db.doc('days/'+date).set(base).then(function(){S.days[date]=base;renderAll()});
  });
}
var sendBusy=false,sendAgain=false,pendingBlobs={},retryT=null;
function dataToBlob(u){var p=u.split(','),m=/data:([^;]+)/.exec(p[0]),b=atob(p[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m?m[1]:'image/jpeg'})}
function webhookOk(u){return /^https:\/\/(discord|discordapp)\.com\/api\/webhooks\/\d+\/[\w-]+/.test(u||'')}
async function postWebhook(text,blobs){
  var url=S.settings.webhookUrl,body={content:String(text).slice(0,1900),username:'宿題ノート'},res;
  if(blobs&&blobs.length){
    var fd=new FormData();fd.append('payload_json',JSON.stringify(body));
    blobs.slice(0,10).forEach(function(b,i){fd.append('files['+i+']',b,'photo'+(i+1)+'.jpg')});
    res=await fetch(url,{method:'POST',body:fd});
  }else{
    res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }
  if(!res.ok){var er=new Error('webhook '+res.status);er.status=res.status;throw er}
}
async function trySend(){
  if(!webhookOk(S.settings.webhookUrl)||!S.db)return;
  if(sendBusy){sendAgain=true;return}
  sendBusy=true;var failed=false;
  try{
    var q=await S.db.collection('outbox').where('sent','==',false).get();
    var list=q.docs.map(function(d){var o=d.data();o.id=d.id;return o}).sort(function(a,b){return a.at-b.at});
    for(var i=0;i<list.length;i++){
      await postWebhook(list[i].text,pendingBlobs[list[i].id]);
      delete pendingBlobs[list[i].id];
      await S.db.doc('outbox/'+list[i].id).update({sent:true,sentAt:Date.now()});
      if(i<list.length-1)await new Promise(function(r){setTimeout(r,400)});
    }
  }catch(e){
    failed=true;console.error(e);
    if(e&&e.status>=400&&e.status<500&&e.status!==429){toast('Discord に送れません。Webhook URL を確認してね')}
    else{clearTimeout(retryT);retryT=setTimeout(trySend,30000)}
  }
  sendBusy=false;
  if(sendAgain&&!failed){sendAgain=false;trySend()}
}
function notify(text,blobs){
  if(!S.db)return;
  var id=uid();
  if(blobs&&blobs.length)pendingBlobs[id]=blobs;
  S.db.doc('outbox/'+id).set({text:text,at:Date.now(),sent:false}).then(trySend).catch(function(){});
}
function migrateNichinoken(){
  var OLD='nichinoken',NEW=[{id:'nichinoken_1h',t:'日能研算数-1時間'},{id:'nichinoken_2h',t:'日能研算数-2時間'},{id:'nichinoken_night',t:'日能研算数-夜'}];
  var cat=S.settings.catalog;
  if(Array.isArray(cat)&&cat.some(function(k){return k.id===OLD})){
    var nc=[];cat.forEach(function(k){if(k.id===OLD)NEW.forEach(function(n){nc.push({id:n.id,t:n.t})});else nc.push(k)});
    saveSettings({catalog:nc});
  }
  var days=S.plan&&S.plan.days;
  if(days&&Object.keys(days).some(function(w){return Array.isArray(days[w])&&days[w].indexOf(OLD)>=0})){
    var nd=clone(days);
    Object.keys(nd).forEach(function(w){if(!Array.isArray(nd[w]))return;var o=[];nd[w].forEach(function(id){if(id===OLD)NEW.forEach(function(n){o.push(n.id)});else o.push(id)});nd[w]=o});
    savePlan(nd);
  }
  Object.keys(S.days).forEach(function(k){
    var d=S.days[k];if(k<S.today||!d||!d.items)return;
    if(!d.items.some(function(i){return i.id===OLD&&!i.ok}))return;
    saveDay(k,function(x){var o=[];x.items.forEach(function(i){if(i.id===OLD&&!i.ok)NEW.forEach(function(n){o.push({id:n.id,t:n.t,ok:false})});else o.push(i)});x.items=o});
  });
}
function dailyOpen(){
  if(!webhookOk(S.settings.webhookUrl)||S.settings.openNotify===false)return;
  var t=S.today;if(S.settings.lastOpen===t)return;
  S.settings.lastOpen=t;
  saveSettings({lastOpen:t}).then(function(){
    var c=calc(t);
    notify('☀️ '+md(t)+' 宿題ノートを開きました。\n今日の宿題 '+c.total+'こ：'+(c.items.map(function(i){return i.t}).join('・')||'なし')+'\n遊びの上限 '+c.limit+'分');
  });
}

function copyText(text){
  var done=function(){toast('コピーしました')};
  var fb=function(){S.viewer={copy:text};renderOver()};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb);return}
  }catch(e){}
  fb();
}
function arm(key){
  if(S.armed&&S.armed.key===key&&Date.now()-S.armed.t<3500){S.armed=null;return true}
  S.armed={key:key,t:Date.now()};renderAll();
  setTimeout(function(){if(S.armed&&S.armed.key===key){S.armed=null;renderAll()}},3600);
  return false;
}
var isArmed=function(key){return S.armed&&S.armed.key===key&&Date.now()-S.armed.t<3500};
function requireParent(cb){
  if(isParent()){S.unlockedUntil=Date.now()+180000;cb();return}
  if(!S.loaded.settings){toast('よみこみ中です。ちょっと待ってね');return}
  S.pin={mode:S.settings.pinHash?'enter':'create',buf:'',first:null,bad:false,cb:cb};
  renderOver();
}

  var dm=c.dayLeft>=0?'今日の遊びは あと'+c.dayLeft+'分（上限'+c.limit+'分）':'遊びの上限を'+(-c.dayLeft)+'分こえたよ';
  if(c.total===0||c.all){
    var lead=c.total===0?'宿題はありません':'ぜんぶOK！';
    st='<div class="status ok"><div class="big num">'+(c.total===0?'OK':c.ok+'<small>/'+c.total+'</small>')+'</div><div class="msg"><b>'+lead+(c.dayLeft>0?' ゲーム・テレビ していいよ':' 今日の遊びは おしまい')+'</b><span>'+dm+'</span></div></div>';
  }else{
    var left=c.total-c.ok;
    st='<div class="status warn'+(isToday?'':' past')+'"><div class="big num">'+c.ok+'<small>/'+c.total+'</small></div><div class="msg"><b>宿題 あと'+left+'こ</b><span>'+(!c.appr?'先取り遊びは 親の承認がいるよ':preLeft>0?'終わるまでは先取り遊び あと'+preLeft+'分':'先取り遊びの時間は つかいきったよ')+'</span></div></div>';
  }
  var rows=c.items.length?c.items.map(function(it){
    var n=S.photos.filter(function(p){return p.itemId===it.id}).length;
    return '<button class="row'+(it.ok?' done':'')+'" data-act="openItem" data-id="'+esc(it.id)+'">'+
      '<span class="mark">'+IC.check+'</span>'+
      '<span class="t">'+esc(it.t)+'</span>'+
      '<span class="meta">'+(n?'<span class="cam">'+IC.cam+n+'</span>':'')+(it.ok?'<span style="color:var(--ok)">OK</span>':'')+IC.chev+'</span></button>';
  }).join(''):'<div class="empty">この日の宿題はまだ入っていません。<br>「宿題管理」タブで追加できます。</div>';

  ensureTimes();
  var dur=S.pEnd-S.pStart,startMs=parse(S.date).getTime()+S.pStart*60000;
  var preForm=dur>0&&isPre(c,startMs),needAppr=preForm&&!c.appr;
  var over=function(n){return '<span class="badge" style="background:var(--bad-bg);color:var(--bad)">'+n+'分オーバー</span>'};
  var big=function(n,neg){return '<span class="v num'+(neg?' neg':'')+'">'+Math.max(n,0)+'<small style="font-size:18px">分</small></span>'};

  var pre='';
  if(!c.all||c.preUsed>0||c.appr||preForm){
    var pct=c.allowance>0?Math.max(0,Math.min(100,c.remain/c.allowance*100)):0;
    pre='<div class="card sect"><div class="ch"><b>先取り</b><span>宿題が終わる前の遊び</span>'+(c.appr?'<span class="badge okb">承認ずみ '+hhmm(c.appr.at)+'</span>':'<span class="badge">承認まち</span>')+'</div>'+
      '<div class="kv"><span>今日の先取り時間</span><b class="num">'+c.allowance+'<small>分</small></b>'+
      '<span class="adj"><button class="mini" data-act="preAdj" data-d="-5">−5分</button><button class="mini" data-act="preAdj" data-d="5">＋5分</button></span></div>'+
      (c.appr?'<div class="apr">'+IC.check+'<span>親が承認しました</span><button class="link" data-act="preUnappr">承認をとりけす</button></div>'
             :'<button class="btn ok" data-act="preApprove">'+(parent?'':IC.lockS)+'親の承認</button>')+
      '<div class="meter" style="margin-top:16px"><span class="lab">今日の先取り 残り</span>'+big(c.remain,c.remain<0)+(c.remain<0?over(-c.remain):'')+'</div>'+
      '<div class="bar'+(c.remain<0?' over':'')+'"><i style="width:'+pct+'%"></i></div>'+
      (c.remain>c.dayLeft&&c.remain>0?'<div class="note" style="margin-top:-6px">総時間の残りが '+Math.max(c.dayLeft,0)+'分なので、そこまでだよ</div>':'')+'</div>';
  }

  var dpct=c.limit>0?Math.max(0,Math.min(100,c.dayLeft/c.limit*100)):0;
  var total='<div class="card sect"><div class="ch"><b>総時間</b><span>ゲーム・テレビ ぜんぶの合計</span></div>'+
    '<div class="meter"><span class="lab">今日の総時間 残り</span>'+big(c.dayLeft,c.dayLeft<0)+(c.dayLeft<0?over(-c.dayLeft):'')+'</div>'+
    '<div class="bar'+(c.dayLeft<0?' over':'')+'"><i style="width:'+dpct+'%"></i></div>'+
    '<div class="note" style="margin-top:-6px">1日の上限 '+c.limit+'分・今日の合計 '+c.playTotal+'分'+(c.preUsed?'（うち先取り '+c.preUsed+'分）':'')+'</div></div>';

  var log=c.plays.length?'<div class="log">'+c.plays.map(function(p){
    var recent=Date.now()-p.at<120000;
    return '<div class="li"><span class="tm" style="width:auto">'+(p.start?p.start+'〜'+p.end:hhmm(p.at))+'</span><span class="num">'+p.min+'分</span>'+
      (p.pre?'<span class="badge">先取り</span>':'')+'<span class="sp"></span>'+
      ((recent||parent)?'<button class="link" data-act="playDel" data-id="'+esc(p.id)+'">'+(isArmed('pd'+p.id)?'もう一度おす':'とりけす')+'</button>':'')+'</div>';
  }).join('')+'</div>':'';
  var form='<div class="card sect"><div class="ch"><b>遊んだ時間を申告</b><span>ゲームでもテレビでもOK</span></div>'+
    timeRow('はじめ','pStart',S.pStart)+timeRow('おわり','pEnd',S.pEnd)+
    '<div class="dur'+(dur>0?'':' bad')+'">'+(dur>0?'<b class="num">'+dur+'</b>分 あそんだ':'おわりを はじめより あとにしてね')+'</div>'+
    '<button class="btn" data-act="playSubmit"'+((S.busy||dur<=0||needAppr)?' disabled':'')+'>この時間を申告する</button>'+
    (needAppr?'<div class="note" style="margin-top:10px;text-align:center">先取りになるので、先に「親の承認」を押してもらってね</div>':'')+
    log+'</div>';
  return st+'<h2>宿題</h2><div class="list">'+rows+'</div><h2>ゲーム・テレビ</h2>'+pre+total+form;
}

/* ---------- render: history ---------- */
function viewHistory(){
  var rows='';
  for(var i=0;i<14;i++){
    var k=shift(S.today,-i),d=parse(k),c=calc(k);
    var dots=c.items.map(function(it){return '<i class="'+(it.ok?'on':'')+'"></i>'}).join('');
    var recorded=c.hasDoc||c.plays.length;
    rows+='<button class="hrow" data-act="openDay" data-d="'+k+'"><div class="hd'+(d.getDay()===0?' sun':'')+'"><b>'+(d.getMonth()+1)+'/'+d.getDate()+'</b><span>'+WD[d.getDay()]+(i===0?'・今日':'')+'</span></div>'+
      '<div class="dots" aria-label="OK '+c.ok+' / '+c.total+'">'+dots+'</div>'+
      '<div class="hsum">'+(recorded?(c.total?'OK <b class="num">'+c.ok+'/'+c.total+'</b>':'')+'<br>遊び <b class="num">'+c.playTotal+'</b>/'+c.limit+'分'+(c.preUsed?'（先取り'+c.preUsed+'分）':''):'記録なし')+'</div>'+IC.chev+'</button>';
  }
  return '<h2>ここ2週間の記録</h2><div class="list">'+rows+'</div>';
}

/* ---------- render: parent ---------- */

function viewManage(){
  if(!isParent()){
    return '<div class="card" style="margin-top:16px;text-align:center"><h3 style="margin:0 0 6px;font-size:19px">親用のページです</h3>'+
      '<p class="note" style="margin:0 0 16px">毎日の宿題をえらんだり、曜日ごとの予定を変えたりできます。</p>'+
      '<button class="btn" data-act="unlock">暗証番号を入れる</button></div>';
  }
  var cat=catalog(),c=calc(S.date),inDay={};
  c.items.forEach(function(i){inDay[i.id]=i});
  var picks=cat.map(function(k){
    var it=inDay[k.id];
    return '<button class="pick'+(it?' on':'')+'" data-act="dayToggle" data-id="'+esc(k.id)+'" aria-pressed="'+(!!it)+'"><span class="box">'+IC.check+'</span><span class="t">'+esc(k.t)+'</span>'+(it&&it.ok?'<span class="okm">OK済み</span>':'')+'</button>';
  }).join('');
  var extra=c.items.filter(function(i){return !cat.some(function(k){return k.id===i.id})}).map(function(i){
    return '<div class="pick on" style="cursor:default"><span class="box">'+IC.check+'</span><span class="t">'+esc(i.t)+' <span class="note">（この日だけ）</span></span><button class="x" data-act="dayDel" data-id="'+esc(i.id)+'" aria-label="消す">✕</button></div>';
  }).join('');
  var order=[1,2,3,4,5,6,0],cur=parse(S.date).getDay();
  var head='<div class="mxr"><span></span>'+order.map(function(n){return '<span class="mxh'+(n===cur?' cur':'')+'">'+WD[n]+'</span>'}).join('')+'</div>';
  var mx=cat.map(function(k){
    var cells=order.map(function(n){var on=planIds(n).indexOf(k.id)>=0;
      return '<button class="mx'+(on?' on':'')+(n===cur?' cur':'')+'" data-act="planToggle" data-v="'+n+'" data-id="'+esc(k.id)+'" aria-pressed="'+on+'" aria-label="'+WD[n]+'曜日 '+esc(k.t)+'">'+(on?IC.check:'')+'</button>'}).join('');
    return '<div class="mxr"><span class="mxl">'+esc(k.t)+'</span>'+cells+'</div>';
  }).join('');
  var cats=cat.map(function(k){return '<div class="item"><span class="t">'+esc(k.t)+'</span><button class="x" data-act="catDel" data-id="'+esc(k.id)+'" aria-label="'+esc(k.t)+'を種類から消す">'+(isArmed('cd'+k.id)?'本当に？':'✕')+'</button></div>'}).join('');
  return '<h2 style="margin-top:20px">'+md(S.date)+' の宿題</h2>'+
    '<div class="sec"><p>やる宿題をタップで選びます。チェックがついたものが、この日のリストに出ます。</p><div class="picks">'+(picks||'<div class="note">宿題の種類がありません。下で追加してください。</div>')+extra+'</div>'+
    '<div class="field"><input type="text" id="dayT" data-keep data-enter="dayAdd" placeholder="この日だけの宿題を追加" maxlength="40" aria-label="この日だけの宿題"><button class="btn" data-act="dayAdd">追加</button></div></div>'+
    '<h2>曜日ごとの予定</h2>'+
    '<div class="sec"><p>毎週くり返す予定です。まだ記録のない日に反映されます。記録のある日は、上で直します。</p><div class="mxwrap">'+head+mx+'</div></div>'+
    '<h2>宿題の種類</h2>'+
    '<div class="sec"><p>ここにある宿題が、上の選択肢になります。</p>'+cats+
    '<div class="field"><input type="text" id="catT" data-keep data-enter="catAdd" placeholder="例：英検の問題集" maxlength="30" aria-label="新しい宿題の名前"><button class="btn" data-act="catAdd">追加</button></div>'+
    '<div class="stack"><button class="btn sub" data-act="catReset">'+(isArmed('cr')?'もう一度おすと もどります':'最初のリストにもどす')+'</button></div></div>';

function lrow(label,sub,val,act,v,cur){
  var b=function(d){return '<button class="mini t" data-act="'+act+'"'+(v!=null?' data-v="'+v+'"':'')+' data-d="'+d+'" aria-label="'+(d>0?'＋':'−')+Math.abs(d)+'分">'+(d>0?'＋':'−')+Math.abs(d)+'</button>'};
  return '<div class="lrow'+(cur?' cur':'')+'"><span class="ll">'+label+(sub?'<em>'+sub+'</em>':'')+'</span>'+b(-15)+b(-5)+'<span class="lv num">'+val+'<small>分</small></span>'+b(5)+b(15)+'</div>';
}
function viewPlay(){
  if(!isParent()){
    return '<div class="card" style="margin-top:16px;text-align:center"><h3 style="margin:0 0 6px;font-size:19px">親用のページです</h3>'+
      '<p class="note" style="margin:0 0 16px">1日の遊び時間（ゲーム＋テレビ）の上限を、日ごと・曜日ごとに決められます。</p>'+
      '<button class="btn" data-act="unlock">暗証番号を入れる</button></div>';
  }
  var c=calc(S.date),cur=parse(S.date).getDay(),o=S.limits[S.date],hasO=!!(o&&typeof o.min==='number');
  var wm=S.settings.limitWd||{},anyO=[0,1,2,3,4,5,6].some(function(n){return typeof wm[n]==='number'});
  var rows=[1,2,3,4,5,6,0].map(function(n){
    var ov=typeof wm[n]==='number';
    return lrow(WD[n],ov?'':'標準',limitForWd(n),'limWdAdj',n,n===cur);

    lrow('上限','',c.limit,'limDayAdj',null,false)+
    '<div class="note" style="margin-top:8px">今日の合計 '+c.playTotal+'分・'+(c.dayLeft>=0?'残り '+c.dayLeft+'分':(-c.dayLeft)+'分オーバー')+'</div>'+
    (hasO?'<div class="stack"><button class="btn sub" data-act="limDayReset">'+WD[cur]+'曜日の設定にもどす</button></div>':'')+'</div>'+
    '<h2>曜日ごとの上限</h2>'+
    '<div class="sec"><p>「標準」の曜日は、いちばん上の標準の値を使います。決めた曜日は、毎週その時間になります。</p>'+
    lrow('標準','初期値',limitDefault(),'limDefAdj',null,false)+rows+
    (anyO?'<div class="stack"><button class="btn sub" data-act="limWdReset">'+(isArmed('lw')?'もう一度おすと 全部の曜日が標準にもどります':'ぜんぶの曜日を標準にそろえる')+'</button></div>':'')+'</div>';
}

  '<div class="sec"><h3>そのほか</h3><p>記録はこの端末のブラウザの中に入っています。ときどきバックアップを保存してね（復活用のファイルが Discord に届きます）。</p>'+

    '<div class="stack" style="margin-top:8px"><button class="btn sub" data-act="changePin">暗証番号を変える</button>'+
    '<button class="btn sub" data-act="cleanPhotos">'+(isArmed('clean')?'もう一度おすと 30日より前の写真を消します':'30日より前の写真を消す')+'</button>'+

    '<button class="btn danger" data-act="lock">親モードを終わる</button></div></div>';
}

function renderMain(){
  var keep={};
  document.querySelectorAll('#main [data-keep]').forEach(function(e){keep[e.id]={v:e.value,f:document.activeElement===e,s:e.selectionStart}});
  var h=S.tab==='today'?viewToday():S.tab==='manage'?viewManage():S.tab==='play'?viewPlay():S.tab==='history'?viewHistory():viewParent();
  $('#main').innerHTML=h;
  Object.keys(keep).forEach(function(id){var e=document.getElementById(id);if(!e)return;e.value=keep[id].v;if(keep[id].f){e.focus();try{e.setSelectionRange(keep[id].s,keep[id].s)}catch(x){}}});
}

        '<button class="btn sub" data-act="closeViewer">とじる</button>'+
        (isParent()?'<button class="btn danger" data-act="delPhoto" data-id="'+esc(S.viewer.id)+'">'+(isArmed('dp'+S.viewer.id)?'もう一度おすと消えます':'この写真を消す')+'</button>':'')+
        '</div></div>';
    }
  }
  if(S.pin){
    var p=S.pin,n=p.buf.length;
    var title=p.mode==='create'?(p.first==null?'親用の暗証番号を決める':'もう一度入れてください'):'暗証番号を入れてください';
    var sub=p.mode==='create'?'4けたの数字。子どもに教えないでね。':'親のOKは暗証番号が必要です。';
    h+='<div class="scrim mid" data-act="pinCancel"><div class="modal" role="dialog" aria-label="暗証番号" data-stop><h3>'+title+'</h3><p>'+(p.bad?'<span style="color:var(--bad);font-weight:700">'+(p.mode==='create'?'一致しません。最初から':'ちがいます')+'</span>':sub)+'</p>'+
      '<div class="pdots'+(p.bad?' bad':'')+'">'+[0,1,2,3].map(function(i){return '<i class="'+(i<n?'on':'')+'"></i>'}).join('')+'</div>'+
      '<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(d){return '<button data-act="pinKey" data-v="'+d+'">'+d+'</button>'}).join('')+

/* ---------- photo ---------- */
function loadBitmap(file){
  if(window.createImageBitmap){return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return viaImg(file)})}
  return viaImg(file);
}
function viaImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=u})}
function drawJpeg(src,max,q,limit){
  var w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,m=max,out;
  for(var i=0;i<8;i++){
    var sc=Math.min(1,m/Math.max(w,h)),cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));
    cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
    out=cv.toDataURL('image/jpeg',q);
    if(!limit||out.length<limit)break;
    q=Math.max(.4,q-.08);m=m*.85;
  }
  return out;
}
async function addPhotos(files){
  var itemId=S.photoTarget,date=S.date;
  if(!itemId||!files||!files.length)return;
  var it=itemsFor(date).filter(function(i){return i.id===itemId})[0];
  var okN=0,blobs=[];
  for(var i=0;i<files.length;i++){
    try{
      toast('アップロード中… '+(i+1)+'/'+files.length);
      var bmp=await loadBitmap(files[i]);
      var full=drawJpeg(bmp,1280,.72,235000),th=drawJpeg(bmp,200,.6,0);
      var id=uid()+i;
      await S.db.doc('photoData/'+id).set({d:full});
      await S.db.doc('photos/'+id).set({date:date,itemId:itemId,at:Date.now(),th:th});
      okN++;blobs.push(dataToBlob(full));
    }catch(e){console.error(e);toast('この写真はアップできませんでした')}
  }
  if(okN){
    toast('写真をアップしたよ（'+okN+'まい）');
    notify('📷 '+md(date)+' '+(it?'「'+it.t+'」':'宿題')+' の写真が'+okN+'枚アップされました。',blobs);
  }
}

/* ---------- summaries ---------- */
function summaryText(date){
  var c=calc(date),ph=S.photos.filter(function(p){return p.date===date}).length;
  var l=['📒 '+md(date)+' の宿題ノート'];
  if(!c.total)l.push('宿題なし');
  c.items.forEach(function(i){l.push((i.ok?'✅ ':'⬜ ')+i.t)});
  if(c.total)l.push('OK '+c.ok+'/'+c.total+(ph?'・写真 '+ph+'枚':''));
  l.push('先取り遊び '+c.preUsed+'/'+c.allowance+'分'+(c.appr?'（承認ずみ）':'')+(c.remain<0?'（'+(-c.remain)+'分オーバー）':''));
  c.plays.forEach(function(p){l.push('🎮📺 '+(p.start?p.start+'〜'+p.end:hhmm(p.at))+' '+p.min+'分'+(p.pre?'（先取り）':''))});
  l.push('遊び合計 '+c.playTotal+'/'+c.limit+'分'+(c.dayLeft<0?'（'+(-c.dayLeft)+'分オーバー⚠️）':''));
  return l.join('\n');
}

function openLocalDb(){
  return new Promise(function(resolve){
    var req;try{req=indexedDB.open('hw-note',1)}catch(e){resolve(null);return}
    req.onupgradeneeded=function(){var d=req.result;d.createObjectStore('docs',{keyPath:'p'});d.createObjectStore('big',{keyPath:'p'})};
    req.onerror=function(){resolve(null)};
    req.onblocked=function(){resolve(null)};
    req.onsuccess=function(){
      var idb=req.result,mem={},listeners=[],fireQ=false,big=/^photoData\//;
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
      var store=function(p){return big.test(p)?'big':'docs'};
      var put=function(p,d){return new Promise(function(res,rej){var st=store(p),t=idb.transaction(st,'readwrite');t.objectStore(st).put({p:p,d:d});t.oncomplete=res;t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})};
      var del=function(p){return new Promise(function(res,rej){var st=store(p),t=idb.transaction(st,'readwrite');t.objectStore(st).delete(p);t.oncomplete=res;t.onerror=function(){rej(t.error)}})};
      var getBig=function(p){return new Promise(function(res,rej){var r=idb.transaction('big','readonly').objectStore('big').get(p);r.onsuccess=function(){res(r.result?r.result.d:undefined)};r.onerror=function(){rej(r.error)}})};
      var all=function(st){return new Promise(function(res,rej){var r=idb.transaction(st,'readonly').objectStore(st).getAll();r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})};
      var fire=function(){if(fireQ)return;fireQ=true;setTimeout(function(){fireQ=false;listeners.slice().forEach(function(f){try{f()}catch(e){console.error(e)}})},0)};
      var addL=function(f){listeners.push(f);setTimeout(f,0);return function(){var i=listeners.indexOf(f);if(i>=0)listeners.splice(i,1)}};
      var snap=function(id,d){return {id:id,exists:d!==undefined,data:function(){return d===undefined?undefined:clone(d)},metadata:{fromCache:false,hasPendingWrites:false}}};
      var cmp=function(a,op,b){switch(op){case '==':return a===b;case '!=':return a!==b;case '<':return a<b;case '<=':return a<=b;case '>':return a>b;case '>=':return a>=b;case 'in':return b.indexOf(a)>=0;default:return false}};
      function doc(path){
        var id=path.split('/').pop();
        return {id:id,path:path,
          get:function(){return big.test(path)?getBig(path).then(function(d){return snap(id,d)}):Promise.resolve(snap(id,mem[path]))},
          set:function(d){var c=clone(d);if(!big.test(path))mem[path]=c;return put(path,c).then(fire)},
          update:function(d){if(!mem[path])return Promise.reject({code:'invalid_argument'});var n=Object.assign({},mem[path],clone(d));mem[path]=n;return put(path,n).then(fire)},
          delete:function(){delete mem[path];return del(path).then(fire)},
          onSnapshot:function(next){return addL(function(){next(snap(id,mem[path]))})}};
      }
      function query(path,filters,ord,lim){
        var q={
          where:function(f,op,v){return query(path,filters.concat([[f,op,v]]),ord,lim)},
          orderBy:function(f,dir){return query(path,filters,[f,dir||'asc'],lim)},
          limit:function(n){return query(path,filters,ord,n)},
          _run:function(){
            var prefix=path+'/',rows=[];
            Object.keys(mem).forEach(function(k){
              if(k.indexOf(prefix)!==0||k.indexOf('/',prefix.length)>=0)return;
              var d=mem[k];if(filters.every(function(f){return cmp(d[f[0]],f[1],f[2])}))rows.push({id:k.slice(prefix.length),d:d});
            });
            if(ord){var f=ord[0],sg=ord[1]==='desc'?-1:1;rows.sort(function(a,b){var x=a.d[f],y=b.d[f];if(x===undefined)return 1;if(y===undefined)return -1;return x<y?-sg:x>y?sg:0})}
            else rows.sort(function(a,b){return a.id<b.id?-1:1});
            if(lim)rows=rows.slice(0,lim);
            var docs=rows.map(function(r){return snap(r.id,r.d)});
            return {docs:docs,size:docs.length,empty:!docs.length};
          },
          get:function(){return Promise.resolve(q._run())},
          onSnapshot:function(next){return addL(function(){next(q._run())})}};
        return q;
      }
      var api={
        doc:doc,
        collection:function(path){var q=query(path,[],null,null);q.path=path;q.doc=function(id){return doc(path+'/'+(id||uid()))};q.add=function(d){var r=doc(path+'/'+uid());return r.set(d).then(function(){return r})};return q},
        _export:function(){return Promise.all([all('docs'),all('big')]).then(function(r){return {v:1,docs:r[0],big:r[1]}})},
        _import:function(o){
          if(!o||!Array.isArray(o.docs))return Promise.reject(new Error('bad'));
          var rows=o.docs.map(function(x){return [x.p,x.d]}).concat((o.big||[]).map(function(x){return [x.p,x.d]}));
          var keys=Object.keys(mem);mem={};
          return Promise.all(keys.map(del)).then(function(){return Promise.all(rows.map(function(r){if(!big.test(r[0]))mem[r[0]]=r[1];return put(r[0],r[1])}))}).then(fire);
        }
      };
      all('docs').then(function(rows){rows.forEach(function(r){mem[r.p]=r.d});resolve(api)},function(){resolve(null)});
    };
  });
}

  db.collection('outbox').where('sent','==',false).limit(60).onSnapshot(function(q){S.outbox=q.docs.map(function(d){var o=d.data();o.id=d.id;return o});renderAll()},function(){});
